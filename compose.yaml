name: thenodewalk

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thenodewalk
      POSTGRES_USER: thenodewalk
      POSTGRES_PASSWORD: thenodewalk
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=thenodewalk --dbname=thenodewalk']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  chromadb:
    image: chromadb/chroma:1.5.3
    restart: unless-stopped
    ports:
      - '${CHROMA_PORT:-8000}:8000'
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8000/api/v2/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  chroma-data:
